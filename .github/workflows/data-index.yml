name: Rebuild data index

on:
  push:
    branches: [main]
    paths:
      - 'data/submissions/**'
      - 'data/crm/**'
      - 'scripts/build-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild manifest
        run: node scripts/build-index.mjs

      - name: Guard against plaintext client data
        run: node scripts/check-encrypted.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/index.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/index.json
            git commit -m "chore(data): rebuild index [skip ci]"
            git push
          else
            echo "index unchanged"
          fi
