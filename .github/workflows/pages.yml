name: Deploy to GitHub Pages

# OPTIONAL. The site is plain static files with a .nojekyll marker at the root,
# so the simplest and most reliable setup is:
#
#   Settings → Pages → Source: "Deploy from a branch" → main → / (root)
#
# That serves the repository directly and needs no workflow at all. Use this
# workflow instead only if you prefer Source: "GitHub Actions" — then run it
# once from the Actions tab and Pages turns itself on.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pages scopes live on this job alone, so nothing else in the repository
    # has to carry them.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on the first time this runs, so no manual
      # switch is needed in repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
