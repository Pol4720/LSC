<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Consola del asesor · AuctionAssist</title>
  <meta name="description" content="Gestión de clientes, requisitos, lotes objetivo y costos para asesores de subastas de autos.">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/ui.css">
  <link rel="stylesheet" href="assets/css/form.css">
  <link rel="stylesheet" href="assets/css/console.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">

  <script>
    (function () {
      try {
        var m = localStorage.getItem('lsc.theme');
        var dark = m === 'dark' || ((!m || m === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';

        var q = new URLSearchParams(location.search).get('lang');
        var saved = localStorage.getItem('lsc.lang');
        var nav = (navigator.language || 'es').slice(0, 2);
        var lang = (q === 'en' || q === 'es') ? q
          : (saved === 'en' || saved === 'es') ? saved
          : (nav === 'en' ? 'en' : 'es');
        document.documentElement.lang = lang;
      } catch (e) { /* private mode */ }
    })();
  </script>
  <style>
    @media (min-width: 961px) { .side-toggle { display: none; } }
    @media (max-width: 620px) { .hide-sm { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <noscript><p style="padding:40px;text-align:center">Esta consola necesita JavaScript.</p></noscript>
    <div style="display:grid;place-items:center;min-height:70vh">
      <div class="spinner" style="width:32px;height:32px" aria-label="Cargando"></div>
    </div>
  </div>

  <script type="module">
    import { boot } from './assets/js/console.js';
    boot(document.getElementById('app')).catch((e) => {
      console.error(e);
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;text-align:center"><h2>Error</h2><pre>' +
        String(e && e.message || e) + '</pre></div>';
    });
  </script>
</body>
</html>
